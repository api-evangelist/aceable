aid: aceable
name: Aceable
description: 'Aceable (Aceable Brands) is an Austin, Texas mobile-first online education
  company founded in 2013 that builds state-accredited licensing and continuing-education
  courses across four brands: Aceable (drivers ed, defensive driving and traffic school
  in 40+ US states), Aceable Agent (real estate pre-license, post-license and CE in
  16 states, plus PrepAgent exam prep in all 50), Aceable Insurance (Property & Casualty
  and Life & Health pre-license in 13 states, CE in CA/IL/TX) and Aceable Mortgage
  (NMLS-approved MLO pre-license and CE in 7 states plus the required 20-hour national
  component; NMLS Provider ID 1400102). More than 20 million students have been licensed
  through Aceable, at roughly 1.5 million per year. The company raised about $106M
  across five rounds from Silverton Partners, Floodgate, Sageview Capital and HGGC,
  and operates a B2B partner program (affiliate and bulk-buy) for driving schools,
  school districts, brokerages, carriers and mortgage employers. Aceable publishes
  no public developer API or developer portal; its platform API at api.aceable.com
  is a private, application-ID-gated backend serving the Aceable web and mobile apps.'
